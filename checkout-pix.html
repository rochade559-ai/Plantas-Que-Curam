<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento PIX | Protocolo Saúde em Dia</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F4F3EF 0%, #E2E6D5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            color: #1E2B19;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1E2B19;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        .btn-pix {
            width: 100%;
            background: #2C4A28;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }

        .btn-pix:hover {
            background: #1A3018;
            transform: scale(1.02);
        }

        .qr-area {
            text-align: center;
            margin-top: 24px;
            padding: 20px;
            background: #F4F3EF;
            border-radius: 16px;
            display: none;
        }

        .qr-area img {
            max-width: 200px;
            margin: 16px auto;
        }

        .qr-code-text {
            width: 100%;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            margin: 8px 0;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .pending {
            background: #FFF3E0;
            color: #FF8C00;
        }

        .approved {
            background: #E8F5E9;
            color: #2C4A28;
        }

        .hidden {
            display: none;
        }

        .copy-btn {
            background: #2C4A28;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2C4A28;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>💰 Pagamento via PIX</h1>
        
        <div class="form-group">
            <label>Seu nome completo</label>
            <input type="text" id="nome" placeholder="Maria Silva" value="Cliente Teste">
        </div>
        <div class="form-group">
            <label>Seu e-mail</label>
            <input type="email" id="email" placeholder="voce@email.com" value="teste@email.com">
        </div>
        <div class="form-group">
            <label>CPF (opcional)</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" value="12345678909">
        </div>
        
        <button class="btn-pix" onclick="gerarPagamentoPIX()">
            <i class="fa-brands fa-pix"></i> Gerar QR Code PIX - R$ 67,00
        </button>
        
        <div id="qrArea" class="qr-area">
            <h3>📱 Escaneie o QR Code</h3>
            <img id="qrCodeImg" src="" alt="QR Code PIX">
            <input type="text" id="qrCodeText" class="qr-code-text" readonly>
            <button class="copy-btn" onclick="copiarPix()">Copiar Código PIX</button>
            <div id="statusArea"></div>
        </div>
        
        <a href="index.html" class="back-link">← Voltar para a loja</a>
    </div>

    <script>
        // Configuração do Mercado Pago
        const mp = new MercadoPago('APP_USR-eb296ecd-1f83-40ca-8f0a-a9d893a35fa6');
        
        let paymentId = null;
        let statusInterval = null;

        async function gerarPagamentoPIX() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;
            
            if (!nome || !email) {
                alert('Preencha nome e e-mail');
                return;
            }
            
            // Mostrar loading
            const btn = document.querySelector('.btn-pix');
            btn.textContent = '⏳ Gerando QR Code...';
            btn.disabled = true;
            
            try {
                // Criar pagamento PIX via API
                const response = await fetch('https://api.mercadopago.com/v1/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer APP_USR-793636591854207-061418-18a33869b0ab21d7170d0940c529d5ed-1724894093',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        transaction_amount: 67.00,
                        description: 'Protocolo Saúde em Dia',
                        payment_method_id: 'pix',
                        payer: {
                            email: email,
                            first_name: nome.split(' ')[0],
                            last_name: nome.split(' ').slice(1).join(' ') || 'Cliente',
                            identification: {
                                type: 'CPF',
                                number: cpf.replace(/\D/g, '') || '12345678909'
                            }
                        }
                    })
                });
                
                const data = await response.json();
                console.log('Resposta:', data);
                
                if (data.id) {
                    paymentId = data.id;
                    
                    // Mostrar QR Code
                    const qrCodeBase64 = data.point_of_interaction.transaction_data.qr_code_base64;
                    const qrCodeText = data.point_of_interaction.transaction_data.qr_code;
                    
                    document.getElementById('qrCodeImg').src = 'data:image/png;base64,' + qrCodeBase64;
                    document.getElementById('qrCodeText').value = qrCodeText;
                    document.getElementById('qrArea').style.display = 'block';
                    
                    // Salvar dados do cliente
                    localStorage.setItem('cliente_nome', nome);
                    localStorage.setItem('cliente_email', email);
                    localStorage.setItem('payment_id', paymentId);
                    
                    // Iniciar verificação de status
                    verificarStatusPagamento();
                } else {
                    alert('Erro ao gerar PIX: ' + (data.message || 'Tente novamente'));
                }
                
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao gerar pagamento. Verifique o console.');
            } finally {
                btn.textContent = 'Gerar QR Code PIX - R$ 67,00';
                btn.disabled = false;
            }
        }
        
        async function verificarStatusPagamento() {
            if (statusInterval) clearInterval(statusInterval);
            
            statusInterval = setInterval(async () => {
                if (!paymentId) return;
                
                try {
                    const response = await fetch(`https://api.mercadopago.com/v1/payments/${paymentId}`, {
                        headers: {
                            'Authorization': 'Bearer APP_USR-793636591854207-061418-18a33869b0ab21d7170d0940c529d5ed-1724894093'
                        }
                    });
                    
                    const data = await response.json();
                    const statusDiv = document.getElementById('statusArea');
                    
                    if (data.status === 'approved') {
                        clearInterval(statusInterval);
                        statusDiv.innerHTML = '<div class="status approved">✅ PAGAMENTO APROVADO! Redirecionando...</div>';
                        
                        // Gerar chave de acesso
                        const chave = 'PC-' + Math.random().toString(36).substring(2, 15).toUpperCase();
                        localStorage.setItem('chave_acesso', chave);
                        localStorage.setItem('compra_realizada', 'true');
                        
                        setTimeout(() => {
                            window.location.href = 'area-membros.html?chave=' + chave;
                        }, 2000);
                        
                    } else if (data.status === 'pending') {
                        statusDiv.innerHTML = '<div class="status pending">⏳ Aguardando pagamento... Escaneie o QR Code</div>';
                    } else if (data.status === 'rejected') {
                        statusDiv.innerHTML = '<div class="status" style="background:#FFEBEE; color:#D4451E;">❌ Pagamento recusado</div>';
                    }
                    
                } catch (error) {
                    console.error('Erro ao verificar status:', error);
                }
            }, 3000);
        }
        
        function copiarPix() {
            const text = document.getElementById('qrCodeText');
            text.select();
            text.setSelectionRange(0, 99999);
            document.execCommand('copy');
            alert('✅ Código PIX copiado! Use no app do seu banco.');
        }
        
        // Verificar se já tem pagamento pendente
        const savedPaymentId = localStorage.getItem('payment_id');
        if (savedPaymentId) {
            paymentId = savedPaymentId;
            verificarStatusPagamento();
        }
    </script>
</body>
</html>

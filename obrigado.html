<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Confirmada | Plantas que Curam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F4F3EF 0%, #E2E6D5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .success-container {
            max-width: 800px;
            background: white;
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .checkmark {
            width: 100px;
            height: 100px;
            background: #2C4A28;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }
        
        .checkmark i { font-size: 4rem; color: white; }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #1E2B19;
        }
        
        .chave-container {
            background: #F4F3EF;
            padding: 1.5rem;
            border-radius: 16px;
            margin: 2rem 0;
            text-align: center;
        }
        
        .chave {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2C4A28;
            letter-spacing: 2px;
            margin: 1rem 0;
            word-break: break-all;
        }
        
        .btn-copiar {
            background: #2C4A28;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0.5rem;
        }
        
        .btn-acessar {
            display: inline-block;
            background: #D4451E;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            margin: 1rem 0;
            transition: all 0.3s;
        }
        
        .btn-acessar:hover {
            transform: scale(1.05);
            background: #b83818;
        }
        
        .info-box {
            background: #FFF3E0;
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
            text-align: left;
        }
        
        @media (max-width: 600px) {
            .success-container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            .chave { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark">
            <i class="fa-solid fa-check"></i>
        </div>
        
        <h1>🎉 Compra Aprovada!</h1>
        <p style="font-size: 1.1rem; margin-bottom: 1rem;">Parabéns, <span id="clienteNome" style="font-weight: 700;">Cliente</span>!</p>
        
        <div class="chave-container">
            <i class="fa-solid fa-key" style="font-size: 2rem; color: #2C4A28;"></i>
            <h3>Sua Chave de Acesso Única:</h3>
            <div class="chave" id="chaveAcesso">Gerando...</div>
            <button class="btn-copiar" onclick="copiarChave()">
                <i class="fa-regular fa-copy"></i> Copiar Chave
            </button>
        </div>
        
        <a href="#" id="btnAcessar" class="btn-acessar" target="_blank">
            <i class="fa-solid fa-door-open"></i> ACESSAR ÁREA DE MEMBROS
        </a>
        
        <div class="info-box">
            <i class="fa-solid fa-envelope" style="color: #2C4A28;"></i>
            <strong>Enviamos um e-mail para:</strong>
            <p id="clienteEmail" style="margin-top: 0.5rem; word-break: break-all;"></p>
            <small>⚠️ Verifique sua caixa de SPAM. Guarde sua chave de acesso!</small>
        </div>
        
        <div class="info-box">
            <i class="fa-regular fa-clock"></i>
            <strong>Links válidos por 7 dias</strong>
            <p style="font-size: 0.9rem;">Após acessar, você terá 30 dias para baixar os materiais.</p>
        </div>
        
        <hr style="margin: 2rem 0;">
        <p style="font-size: 0.8rem; color: #888;">© 2026 Plantas que Curam</p>
    </div>
    
    <script>
        // Gerar chave única
        function gerarChaveUnica(email, nome) {
            const timestamp = Date.now();
            const hash = btoa(`${email}|${timestamp}|${Math.random()}`).substring(0, 20);
            return `PC-${hash.toUpperCase()}`;
        }
        
        const nome = localStorage.getItem('cliente_nome') || 'Cliente';
        const email = localStorage.getItem('cliente_email') || 'nao_informado@email.com';
        
        document.getElementById('clienteNome').innerText = nome;
        document.getElementById('clienteEmail').innerHTML = email;
        
        // Gerar e salvar chave
        let chave = localStorage.getItem('chave_acesso');
        if (!chave) {
            chave = gerarChaveUnica(email, nome);
            localStorage.setItem('chave_acesso', chave);
        }
        
        document.getElementById('chaveAcesso').innerText = chave;
        
        // Link para área de membros
        const btnAcessar = document.getElementById('btnAcessar');
        btnAcessar.href = `area-membros.html?chave=${encodeURIComponent(chave)}`;
        
        // Função copiar
        window.copiarChave = function() {
            const chave = document.getElementById('chaveAcesso').innerText;
            navigator.clipboard.writeText(chave);
            alert('✅ Chave copiada! Use para acessar sua área de membros.');
        };
        
        // Simular envio de e-mail (guardar para envio real)
        const compras = JSON.parse(localStorage.getItem('compras') || '[]');
        compras.push({
            nome: nome,
            email: email,
            chave: chave,
            data: new Date().toISOString(),
            preference_id: localStorage.getItem('preference_id')
        });
        localStorage.setItem('compras', JSON.stringify(compras));
        
        console.log('✅ Chave salva:', chave);
        console.log('📧 E-mail para enviar:', email);
        console.log('🔗 Link:', btnAcessar.href);
    </script>
</body>
</html>
